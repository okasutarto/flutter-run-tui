[package]
name = "frun-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "frun"
path = "src/main.rs"

[[bin]]
name = "frun-tui"
path = "src/main.rs"

# frun: a TUI front end for `flutter run`, through FVM or a plain SDK,
# implementing DESIGN.md.
#
# The mock data behind every state frame is still here, reachable through
# --dump/--all/--rows/--hits. Layout bugs in this codebase are silent, so being
# able to render a state without a device attached is the verification story,
# not leftover scaffolding.

[dependencies]
# crossterm is used via ratatui::crossterm rather than as a direct dependency.
# ratatui re-exports the exact version it was built against, which is the
# documented way to keep two incompatible crossterms out of the tree.
ratatui = "=0.30.2"

# Log line wrapping, per DESIGN.md 6.1. Word-boundary aware, display-width
# aware, and `subsequent_indent` is exactly the rule that continuation rows
# indent to the message column with the gutter left empty. Hand-rolling this
# would have meant reimplementing word breaking badly.
textwrap = "0.16.2"

# Column arithmetic for the 18-column gutter. `str::len()` counts bytes and
# would be wrong for every non-ASCII glyph in the palette.
unicode-width = "0.2.2"

# The Flutter logo, rendered through whichever graphics protocol the terminal
# actually supports, with a halfblocks fallback.
#
# default-features is off deliberately: the default set includes `chafa-dyn`,
# which dynamically links libchafa and would make the binary depend on that
# library being present at runtime.
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm"] }

# Depended on directly with only PNG enabled, rather than through
# ratatui-image's `image-defaults`. That feature pulls decoders for JPEG, GIF,
# WebP, TIFF and more, none of which are needed for one embedded PNG.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# JSON, for the three sources that speak it: `flutter devices --machine`,
# `xcrun simctl list -j`, and the SDK's flutter.version.json. Hand-rolling a
# parser for nested simctl output would be a bug farm; this is the one place a
# dependency is cheaper than the code it replaces.
serde_json = "=1.0.151"
# pty, for `flutter run` through the resolved toolchain. Flutter only opens its
# interactive session on a tty, and std has no pty at all, so the alternative is
# forkpty through unsafe plus hand-rolled child reaping.
portable-pty = "=0.9.0"

# Parse FRUN_FLUTTER without losing quoted arguments or executable paths that
# contain spaces. A plain whitespace split turns `/Applications/Flutter SDK`
# into two unrelated argv entries.
shell-words = "=1.1.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
